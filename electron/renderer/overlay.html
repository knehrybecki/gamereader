<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; background: rgba(17, 19, 24, 0.92); color: #f4f1ea; font-family: "SF Pro Display", sans-serif; -webkit-app-region: drag; }
    .box { padding: 14px 18px; }
    .hint { color: #8b93a7; font-size: 11px; margin-bottom: 6px; }
    #text { font-size: 22px; font-weight: 700; line-height: 1.3; }
  </style>
</head>
<body>
  <div class="box">
    <div class="hint">⋮⋮  trzymaj to okno z dala od napisów</div>
    <div id="text">Czekam na polski napis…</div>
  </div>
  <script>
    window.gr.onEvent((msg) => {
      if (msg.event === "line" && msg.text) {
        document.getElementById("text").textContent = msg.text;
      }
    });
  </script>
</body>
</html>
