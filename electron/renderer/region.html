<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    .frame {
      position: absolute;
      inset: 0;
      border: 3px solid #7cffd0;
      box-shadow: inset 0 0 0 9999px rgba(124, 255, 208, 0.10);
      box-sizing: border-box;
    }
    .tag {
      position: absolute;
      top: 4px;
      left: 6px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(8, 33, 27, 0.82);
      color: #7cffd0;
      font: 700 11px "SF Pro Display", "Helvetica Neue", sans-serif;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="frame"><span class="tag">SKAN NAPISÓW</span></div>
</body>
</html>
