<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Zaznacz napisy</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; }
  body { background: rgba(8, 10, 16, 0.28); font-family: "Segoe UI", system-ui, sans-serif; }
  #hint {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    padding: 10px 16px; border-radius: 10px; background: rgba(11, 13, 18, 0.88);
    color: #fff; font-size: 15px; pointer-events: none;
  }
  #box {
    position: fixed; display: none; border: 2px solid #4cc3ff;
    background: rgba(76, 195, 255, 0.12); box-shadow: 0 0 0 9999px rgba(8, 10, 16, 0.25);
  }
</style>
</head>
<body>
<div id="hint">Przeciągnij prostokąt na pasku napisów. Esc albo prawy przycisk anuluje.</div>
<div id="box"></div>
<script>
  const box = document.getElementById("box");
  let start = null;
  let rect = null;
  function draw(x, y) {
    rect = {
      x: Math.min(start.x, x),
      y: Math.min(start.y, y),
      width: Math.abs(x - start.x),
      height: Math.abs(y - start.y),
    };
    Object.assign(box.style, {
      display: "block",
      left: rect.x + "px",
      top: rect.y + "px",
      width: rect.width + "px",
      height: rect.height + "px",
    });
  }
  window.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    start = { x: e.clientX, y: e.clientY };
    draw(e.clientX, e.clientY);
  });
  window.addEventListener("mousemove", (e) => {
    if (start) draw(e.clientX, e.clientY);
  });
  window.addEventListener("mouseup", (e) => {
    if (!start) return;
    draw(e.clientX, e.clientY);
    start = null;
    window.pick.done(rect && rect.width >= 8 && rect.height >= 8 ? rect : null);
  });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") window.pick.done(null);
  });
  window.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    window.pick.done(null);
  });
</script>
</body>
</html>
