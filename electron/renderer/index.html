<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GameReader</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="drag">
      <button id="collapse" class="btn icon" title="Zwiń">−</button>
      <div class="brand">
        <h1>GameReader</h1>
        <p class="sub">⋮⋮  tu przeciągnij</p>
      </div>
      <div id="live" class="pill off">WYŁ</div>
      <button id="startMini" class="btn tiny primary">Czytaj</button>
    </header>

    <div id="panel" class="panel">
      <div class="modes">
        <button id="modeAuto" class="btn primary">Napisy + dźwięk</button>
        <button id="modeOcr" class="btn">Napisy</button>
        <button id="modeAudio" class="btn">Dźwięk</button>
      </div>

      <div class="row">
        <label class="muted">Gra</label>
        <select id="game">
          <option value="rdr2">Red Dead Redemption 2</option>
          <option value="tlou">The Last of Us</option>
          <option value="gow">God of War</option>
          <option value="gta">GTA / Uncharted</option>
          <option value="souls">Souls / Elden Ring</option>
          <option value="hogwarts">Hogwarts Legacy</option>
          <option value="generic">Inna gra</option>
        </select>
      </div>
      <p id="gameHint" class="hint">Napisy biorą się z okna PS Remote Play.</p>
      <p id="psWin" class="hint">Szukam PS Remote Play…</p>

      <div class="row">
        <button id="start" class="btn primary grow">Czytaj</button>
        <button id="test" class="btn">Test</button>
        <button id="pick" class="btn">Ręcznie</button>
      </div>
      <div class="row">
        <label class="toggle"><input id="showRegion" type="checkbox" /> Pokaż obszar skanu</label>
        <button id="save" class="btn tiny grow">Zapisz</button>
      </div>

      <p id="status" class="status">Szukam okna PS Remote Play…</p>

      <section class="card">
        <div class="card-h">LEKTOR <span id="mood" class="gold">—</span></div>
        <div id="line" class="line"></div>
      </section>

      <section class="card slim">
        <div class="card-h">USŁYSZANE</div>
        <p id="heard" class="heard">Czekam na dźwięk EN.</p>
      </section>

      <div class="row sliders">
        <label class="muted">Głośność</label>
        <input id="intensity" type="range" min="0.6" max="1.6" step="0.1" value="1" />
        <span id="intensityVal" class="num">1,0</span>
      </div>
      <div class="row sliders">
        <label class="muted">Skan</label>
        <input id="interval" type="range" min="0.12" max="0.8" step="0.02" value="0.16" />
        <span id="intervalVal" class="num">0,16 s</span>
        <button id="scanAuto" class="btn tiny primary">Auto</button>
      </div>

      <div class="row hidden">
        <select id="device"></select>
        <input id="overlay" type="checkbox" />
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
