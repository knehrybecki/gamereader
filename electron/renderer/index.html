<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiveDub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="drag">
      <span id="dot" class="dot" aria-hidden="true"></span>
      <div class="brand">
        <h1>Live<span class="accent">Dub</span></h1>
        <p id="psWin" class="sub">Czekam na grę…</p>
      </div>
      <div id="live" class="pill off">WYŁ</div>
      <button id="startMini" class="btn tiny primary">Uruchom</button>
      <button id="appMenu" class="btn icon hidden" title="Menu: aktualizacje, pomoc, O LiveDub">☰</button>
      <button id="collapse" class="btn icon" title="Zwiń">−</button>
      <button id="quit" class="btn icon quit" title="Wyłącz LiveDub" aria-label="Wyłącz LiveDub">⏻</button>
    </header>

    <div id="panel" class="panel">
      <div class="seg src" role="group" aria-label="Skąd czytać">
        <button id="srcAuto" class="seg-btn" title="PS Remote Play, a bez niego Netflix/YouTube w Chrome">Auto</button>
        <button id="srcPs" class="seg-btn" title="PS Remote Play (PS5)">PS5</button>
        <button id="srcChrome" class="seg-btn" title="Dowolna strona w Chrome — napisy (pasek automatyczny albo „Zaznacz obszar”) i dźwięk EN→PL">Chrome</button>
      </div>

      <button id="start" class="btn primary big">Uruchom</button>

      <section class="card">
        <div id="line" class="line">Włącz grę w PS Remote Play albo Netflixa/YouTube w Chrome — LiveDub wystartuje sam.</div>
        <div class="emo" title="Emocja z głosu postaci"><span id="emoBar"></span></div>
        <p id="heard" class="heard"></p>
      </section>

      <div class="row sliders">
        <label class="muted" for="lektorVolume">Lektor</label>
        <input id="lektorVolume" type="range" min="0" max="100" step="5" value="80" />
        <span id="lektorVolumeVal" class="num">80%</span>
      </div>
      <div class="row sliders">
        <label class="muted" for="duckAmount" title="O ile ściszyć grę, gdy mówi lektor (0% = wcale)">Ścisz grę</label>
        <input id="duckAmount" type="range" min="0" max="100" step="5" value="70" />
        <span id="duckAmountVal" class="num">70%</span>
      </div>

      <p id="status" class="status">Ładuję lektora…</p>

      <details class="more">
        <summary>Więcej</summary>

        <div class="seg" role="group" aria-label="Źródło">
          <button id="modeAuto" class="seg-btn">Napisy + dźwięk</button>
          <button id="modeOcr" class="seg-btn">Napisy</button>
          <button id="modeAudio" class="seg-btn">Dźwięk</button>
        </div>

        <div class="row">
          <label class="muted" for="game">Gra</label>
          <select id="game"></select>
        </div>
        <p id="gameHint" class="hint"></p>

        <label class="toggle"><input id="autoStart" type="checkbox" checked /> Startuj sam, gdy wykryję grę</label>

        <div class="row">
          <label class="muted" for="lektorEngine" title="Supertonic: szybki, na procesorze. VoiceStudio: naturalniejszy głos z voicepacka, na GPU Maca.">Głos</label>
          <select id="lektorEngine">
            <option value="supertonic">Supertonic (szybki)</option>
            <option value="voicestudio">VoiceStudio (voicepack)</option>
          </select>
        </div>
        <div id="omniPackRow" class="row hidden">
          <label class="muted" for="omniPack">Voicepack</label>
          <select id="omniPack"></select>
        </div>

        <div class="row">
          <button id="test" class="btn grow">Test napisu</button>
          <button id="pick" class="btn grow">Zaznacz obszar</button>
        </div>
        <div class="row">
          <label class="toggle"><input id="showRegion" type="checkbox" /> Pokaż obszar</label>
          <button id="save" class="btn tiny">Zapisz</button>
        </div>
      </details>


      <div class="hidden">
        <select id="device"></select>
        <input id="overlay" type="checkbox" />
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
