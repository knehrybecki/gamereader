name: Build LiveDub

# Oszczędnie z minutami Actions (macOS liczy się 10×):
# - PR: tylko szybki test składni na Linuksie (test silnika na Windowsie — osobny workflow, gdy zmienia się silnik),
# - push/merge na main: budowa Mac .zip + Windows .exe i nowe wydanie, z którego aplikacja sama się aktualizuje,
# - ręcznie (Run workflow): budowa paczek z dowolnej gałęzi, bez wydania.
# Numer: wersja z electron/package.json, a jeśli takie wydanie już jest — kolejna wolna
# (1.3.0 → 1.3.1 → 1.3.2 …). Większy skok (np. 1.4.0) = zmień wersję w package.json.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Składnia silnika i Electrona
        run: |
          python3 -m py_compile gamereader_engine.py gamereader_worker.py lektor_brain.py omnivoice_sidecar.py gamereader_gui.py gamereader_win.py ci/win_smoke.py
          for f in electron/*.js electron/renderer/*.js ci/*.js; do node --check "$f"; done

  version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Numer wersji
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(node -p "require('./electron/package.json').version")"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            MAJOR="$(echo "$VERSION" | cut -d. -f1)"
            MINOR="$(echo "$VERSION" | cut -d. -f2)"
            PATCH="$(echo "$VERSION" | cut -d. -f3)"
            while gh release view "v$MAJOR.$MINOR.$PATCH" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
            done
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Buduję wersję $VERSION"

  mac:
    needs: version
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Cache Electrona (pobierany przy każdej budowie)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-mac-${{ hashFiles('electron/package-lock.json') }}

      - name: Python 3.14 (Homebrew) dla Engine.app
        run: brew install python@3.14 || brew upgrade python@3.14

      - name: Wersja w aplikacji
        # wersja trafia do aplikacji (app.getVersion) — tylko w tej kompilacji, bez commita
        working-directory: electron
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Zależności Electron
        working-directory: electron
        run: npm ci

      - name: Sprawdź składnię silnika
        run: python3 -m py_compile gamereader_engine.py gamereader_worker.py lektor_brain.py omnivoice_sidecar.py gamereader_gui.py gamereader_win.py

      - name: Stały podpis (certyfikat „LiveDub Release” z sekretów)
        # Bez certyfikatu Apple: własny, zawsze ten sam certyfikat — macOS pamięta zgody (nagrywanie ekranu)
        # po aktualizacji. Tworzy go ci/setup_public_releases.sh. Bez sekretów podpis ad-hoc jak dotąd.
        env:
          P12: ${{ secrets.MAC_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::Brak sekretu MAC_SIGN_P12 — podpis ad-hoc (zgody macOS znikają po każdej aktualizacji)"
            exit 0
          fi
          KC="$RUNNER_TEMP/livedub.keychain-db"
          KC_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # certyfikat self-signed: zaufanie do podpisu kodu tylko na tym runnerze
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/sign.p12" -passin env:P12_PASSWORD -clcerts -nokeys -out "$RUNNER_TEMP/sign.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.pem"
          rm -f "$RUNNER_TEMP/sign.p12" "$RUNNER_TEMP/sign.pem"
          security find-identity -v -p codesigning "$KC"
          echo "LIVEDUB_SIGN_ID=LiveDub Release" >> "$GITHUB_ENV"

      - name: Buduj LiveDub.app
        env:
          LIVEDUB_NO_INSTALL: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: sh macos/build_app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LiveDub-mac-arm64
          path: electron/dist/LiveDub-mac-arm64.zip
          if-no-files-found: error

  windows:
    needs: version
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Cache Electrona (pobierany przy każdej budowie)
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('electron/package-lock.json') }}

      - name: Wersja w aplikacji
        working-directory: electron
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Zależności Electron
        working-directory: electron
        run: npm ci

      - name: Buduj instalator LiveDub (Windows x64)
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: LiveDub-win-x64
          path: electron/dist/LiveDub-Setup-win-x64.exe
          if-no-files-found: error

  release:
    needs: [version, mac, windows]
    # wydanie wychodzi z Maciem także wtedy, gdy paczka Windows się nie zbudowała
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.mac.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Wydanie (nowa wersja na main)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          FILES="dist/LiveDub-mac-arm64.zip"
          if [ -f dist/LiveDub-Setup-win-x64.exe ]; then
            FILES="$FILES dist/LiveDub-Setup-win-x64.exe"
          else
            echo "::warning::Brak instalatora Windows — wydanie tylko z paczką na Maca"
          fi
          gh release create "v$VERSION" $FILES \
            --target "$GITHUB_SHA" --title "LiveDub $VERSION" --generate-notes
          echo "FILES=$FILES" >> "$GITHUB_ENV"

      - name: Wydanie publiczne (knehrybecki/livedub-releases)
        # stąd pobierają i aktualizują się wszyscy (repo z kodem jest prywatne)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Brak sekretu RELEASES_TOKEN — wydanie tylko w prywatnym repo (uruchom ci/setup_public_releases.sh)"
            exit 0
          fi
          gh release create "v$VERSION" $FILES -R knehrybecki/livedub-releases \
            --title "LiveDub $VERSION" --notes-file ci/INSTALACJA.md
