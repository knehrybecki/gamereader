name: Build LiveDub

# Każdy push buduje aplikację (artefakt do pobrania z zakładki Actions).
# Każdy push/merge na main publikuje nowe wydanie, z którego aplikacja sama się aktualizuje.
# Numer: wersja z electron/package.json, a jeśli takie wydanie już jest — kolejna wolna
# (1.3.0 → 1.3.1 → 1.3.2 …). Większy skok (np. 1.4.0) = zmień wersję w package.json.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Python 3.14 (Homebrew) dla Engine.app
        run: brew install python@3.14 || brew upgrade python@3.14

      - name: Numer wersji
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./electron/package.json').version")"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            MAJOR="$(echo "$VERSION" | cut -d. -f1)"
            MINOR="$(echo "$VERSION" | cut -d. -f2)"
            PATCH="$(echo "$VERSION" | cut -d. -f3)"
            while gh release view "v$MAJOR.$MINOR.$PATCH" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
            done
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # wersja trafia do aplikacji (app.getVersion) — tylko w tej kompilacji, bez commita
          cd electron && npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Buduję wersję $VERSION"

      - name: Zależności Electron
        working-directory: electron
        run: npm ci

      - name: Sprawdź składnię silnika
        run: python3 -m py_compile gamereader_engine.py gamereader_worker.py gamereader_gui.py

      - name: Buduj LiveDub.app
        env:
          LIVEDUB_NO_INSTALL: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: sh macos/build_app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LiveDub-mac-arm64
          path: electron/dist/LiveDub-mac-arm64.zip
          if-no-files-found: error

      - name: Wydanie (nowa wersja na main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          gh release create "$TAG" electron/dist/LiveDub-mac-arm64.zip \
            --target "$GITHUB_SHA" --title "LiveDub $VERSION" --generate-notes
