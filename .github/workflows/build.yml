name: Build LiveDub

# Każdy push buduje aplikację na macOS i Windows (artefakty do pobrania z zakładki Actions).
# Każdy push/merge na main publikuje nowe wydanie (Mac .zip + Windows .exe), z którego aplikacja
# sama się aktualizuje. Numer: wersja z electron/package.json, a jeśli takie wydanie już jest —
# kolejna wolna (1.3.0 → 1.3.1 → 1.3.2 …). Większy skok (np. 1.4.0) = zmień wersję w package.json.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Numer wersji
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(node -p "require('./electron/package.json').version")"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            MAJOR="$(echo "$VERSION" | cut -d. -f1)"
            MINOR="$(echo "$VERSION" | cut -d. -f2)"
            PATCH="$(echo "$VERSION" | cut -d. -f3)"
            while gh release view "v$MAJOR.$MINOR.$PATCH" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
            done
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Buduję wersję $VERSION"

  mac:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Python 3.14 (Homebrew) dla Engine.app
        run: brew install python@3.14 || brew upgrade python@3.14

      - name: Wersja w aplikacji
        # wersja trafia do aplikacji (app.getVersion) — tylko w tej kompilacji, bez commita
        working-directory: electron
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Zależności Electron
        working-directory: electron
        run: npm ci

      - name: Sprawdź składnię silnika
        run: python3 -m py_compile gamereader_engine.py gamereader_worker.py gamereader_gui.py gamereader_win.py

      - name: Buduj LiveDub.app
        env:
          LIVEDUB_NO_INSTALL: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: sh macos/build_app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LiveDub-mac-arm64
          path: electron/dist/LiveDub-mac-arm64.zip
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Wersja w aplikacji
        working-directory: electron
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Zależności Electron
        working-directory: electron
        run: npm ci

      - name: Buduj instalator LiveDub (Windows x64)
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: LiveDub-win-x64
          path: electron/dist/LiveDub-Setup-win-x64.exe
          if-no-files-found: error

  # Test silnika na prawdziwym Windowsie: instalacja jak u użytkownika, okna, zrzut, OCR, tłumacz, lektor.
  # Osobno od budowania — wydanie nie czeka na pobieranie modeli.
  windows-engine-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalacja silnika (jak przy pierwszym uruchomieniu)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ci/win_setup.js

      - name: Test silnika
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE"
          "$LIVEDUB_PY" -m py_compile gamereader_engine.py gamereader_worker.py gamereader_win.py
          "$LIVEDUB_PY" ci/win_smoke.py

  release:
    needs: [version, mac, windows]
    # wydanie wychodzi z Maciem także wtedy, gdy paczka Windows się nie zbudowała
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.mac.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Wydanie (nowa wersja na main)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          FILES="dist/LiveDub-mac-arm64.zip"
          if [ -f dist/LiveDub-Setup-win-x64.exe ]; then
            FILES="$FILES dist/LiveDub-Setup-win-x64.exe"
          else
            echo "::warning::Brak instalatora Windows — wydanie tylko z paczką na Maca"
          fi
          gh release create "v$VERSION" $FILES \
            --target "$GITHUB_SHA" --title "LiveDub $VERSION" --generate-notes
